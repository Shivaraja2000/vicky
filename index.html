<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <style>
   body {
  font-family: Arial, sans-serif;
  background-image: url('./images/lo.jpg'); /* Replace with your image URL */
  background-size: cover; /* Ensures the image covers the entire page */
  background-position: center; /* Centers the background image */
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.login-container {
  background-color: rgba(255, 255, 255, 0.2); /* Transparent white background */
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  width: 300px;
}

    .login-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .input-field {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    .login-button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    .login-button:hover {
      background-color: #45a049;
    }

    .error-message {
      color: red;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="text" id="username" class="input-field" placeholder="Username" required>
      <input type="password" id="password" class="input-field" placeholder="Password" required>
      <button type="submit" class="login-button">Login</button>
      <div class="error-message" id="error-message"></div>
    </form>
  </div>

  <script>
    // Login credentials
    const correctUsername = "vicky";
    const correctPassword = "udhaya";

    // Handle form submission
    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault(); // Prevent page refresh

      // Get entered username and password
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      // Check if the entered credentials match the correct ones
      if (username === correctUsername && password === correctPassword) {
        // Redirect to love.html upon successful login
        window.location.href = 'love.html';
      } else {
        // Display error message if login fails
        document.getElementById('error-message').textContent = "Incorrect username or password!";
      }
    });
  </script>

</body>
</html>
